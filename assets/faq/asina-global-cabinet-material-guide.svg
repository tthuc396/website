<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="140" y1="90" x2="1050" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F0E5"/>
      <stop offset="1" stop-color="#E6DDD0"/>
    </linearGradient>
    <linearGradient id="panelA" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF7F2"/>
      <stop offset="1" stop-color="#E4D9CB"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D5B894"/>
      <stop offset="1" stop-color="#9D7352"/>
    </linearGradient>
    <linearGradient id="panelC" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8A696"/>
      <stop offset="1" stop-color="#7D6B5C"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#5A4130" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="40" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="1056" height="756" rx="30" fill="#FFFCF8"/>
  </g>
  <text x="110" y="146" fill="#6B4F3D" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3">ASINA GLOBAL</text>
  <text x="110" y="214" fill="#171311" font-family="Georgia, 'Times New Roman', serif" font-size="66">Cabinet Material Guide</text>
  <text x="110" y="258" fill="#5C5550" font-family="Arial, sans-serif" font-size="24">A cleaner summary of the cabinet materials and construction notes builders and developers usually ask about first.</text>

  <g transform="translate(110 328)">
    <text x="0" y="0" fill="#6B4F3D" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">FACE OPTIONS</text>
    <rect x="0" y="32" width="260" height="72" rx="18" fill="url(#panelA)"/>
    <text x="28" y="77" fill="#171311" font-family="Arial, sans-serif" font-size="28" font-weight="700">Painted Shaker</text>
    <text x="28" y="127" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">Malibu and Jersey</text>

    <rect x="0" y="144" width="260" height="72" rx="18" fill="url(#panelB)"/>
    <text x="28" y="189" fill="#FFF8F0" font-family="Arial, sans-serif" font-size="28" font-weight="700">Stained Wood</text>
    <text x="28" y="239" fill="#F0E5DB" font-family="Arial, sans-serif" font-size="18">Monterey</text>

    <rect x="0" y="256" width="260" height="72" rx="18" fill="url(#panelC)"/>
    <text x="28" y="301" fill="#FFF8F0" font-family="Arial, sans-serif" font-size="28" font-weight="700">Modern Surfaces</text>
    <text x="28" y="351" fill="#F0E5DB" font-family="Arial, sans-serif" font-size="18">Newport, Catalina, Laguna</text>
  </g>

  <g transform="translate(442 316)">
    <rect x="122" y="42" width="248" height="316" rx="22" fill="#EFE6D9" stroke="#C9B7A6" stroke-width="2"/>
    <rect x="146" y="72" width="200" height="34" rx="10" fill="#C6B29E"/>
    <rect x="166" y="128" width="160" height="174" rx="10" fill="#F9F6F1" stroke="#D9CABC" stroke-width="2"/>
    <rect x="186" y="150" width="120" height="132" rx="8" fill="#E8DED2"/>
    <rect x="146" y="318" width="200" height="22" rx="8" fill="#C7AD8B"/>
    <rect x="376" y="132" width="174" height="132" rx="18" fill="#F7EFE4" stroke="#D4C1AD" stroke-width="2"/>
    <rect x="398" y="154" width="130" height="88" rx="12" fill="#EDE1D1"/>
    <rect x="424" y="180" width="78" height="36" rx="8" fill="#C8AF93"/>

    <line x1="18" y1="86" x2="128" y2="86" stroke="#9E836D" stroke-width="2"/>
    <line x1="18" y1="186" x2="128" y2="186" stroke="#9E836D" stroke-width="2"/>
    <line x1="18" y1="330" x2="128" y2="330" stroke="#9E836D" stroke-width="2"/>
    <line x1="370" y1="198" x2="550" y2="198" stroke="#9E836D" stroke-width="2"/>

    <text x="0" y="80" fill="#171311" font-family="Arial, sans-serif" font-size="22" font-weight="700">Door / face</text>
    <text x="0" y="110" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">Painted, stained, melamine,</text>
    <text x="0" y="136" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">lacquer, or soft-touch options</text>

    <text x="0" y="180" fill="#171311" font-family="Arial, sans-serif" font-size="22" font-weight="700">Cabinet box</text>
    <text x="0" y="210" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">Premium plywood construction</text>
    <text x="0" y="236" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">varies by collection platform</text>

    <text x="0" y="324" fill="#171311" font-family="Arial, sans-serif" font-size="22" font-weight="700">Shelf / back panel</text>
    <text x="0" y="354" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">Quote-ready thickness notes</text>
    <text x="0" y="380" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">are shown on each collection page</text>

    <text x="560" y="192" fill="#171311" font-family="Arial, sans-serif" font-size="22" font-weight="700">Drawer box</text>
    <text x="560" y="222" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">Soft-close and dovetail notes</text>
    <text x="560" y="248" fill="#6B625C" font-family="Arial, sans-serif" font-size="18">appear where the PDF supports them</text>
  </g>

  <g transform="translate(110 726)">
    <text x="0" y="0" fill="#171311" font-family="Arial, sans-serif" font-size="22" font-weight="700">How to use this</text>
    <text x="0" y="34" fill="#5C5550" font-family="Arial, sans-serif" font-size="19">Match the collection first, then compare face material, box platform, and any thickness notes shown on that collection page.</text>
  </g>
